{namespace be=TYPO3\CMS\Backend\ViewHelpers}
<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate domain="typo3_chameleon_login.module" key="title" /></h1>
    <f:variable name="returnUrl" value="{f:be.uri(route: 'site_login_seasons')}" />
    <f:if condition="{seasons}">
        <f:then>
            <f:render section="Table" arguments="{_all}" />
        </f:then>
        <f:else>
            <f:be.infobox state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}" title="{f:translate(domain: 'typo3_chameleon_login.module', key: 'empty.title')}">
                <p><f:translate domain="typo3_chameleon_login.module" key="empty.message" /></p>
                <be:link.newRecord table="{table}" returnUrl="{returnUrl}" class="btn btn-primary">
                    <f:translate domain="typo3_chameleon_login.module" key="season.new" />
                </be:link.newRecord>
            </f:be.infobox>
        </f:else>
    </f:if>
</f:section>

<f:section name="Table">
    <f:variable name="badgeClasses" value="{active: 'success', overridden: 'warning', upcoming: 'info', expired: 'default', hidden: 'default'}" />
    <div class="table-fit">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col" colspan="2"><f:translate domain="typo3_chameleon_login.db" key="season.title" /></th>
                    <th scope="col"><f:translate domain="typo3_chameleon_login.module" key="column.period" /></th>
                    <th scope="col"><f:translate domain="typo3_chameleon_login.db" key="season.priority" /></th>
                    <th scope="col"><f:translate domain="typo3_chameleon_login.module" key="column.status" /></th>
                    <th scope="col" class="col-control"><span class="visually-hidden"><f:translate domain="typo3_chameleon_login.module" key="column.actions" /></span></th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{seasons}" as="season">
                    <tr>
                        <td class="col-icon">
                            <core:iconForRecord table="{table}" row="{season}" />
                        </td>
                        <td>
                            <be:link.editRecord table="{table}" uid="{season.uid}" returnUrl="{returnUrl}">{season.title}</be:link.editRecord>
                        </td>
                        <td>
                            <f:format.date date="{season.valid_from}" /> – <f:format.date date="{season.valid_until}" />
                            <f:if condition="{season.recurring}">
                                <span class="badge badge-default"><f:translate domain="typo3_chameleon_login.module" key="period.yearly" /></span>
                            </f:if>
                        </td>
                        <td>{season.priority}</td>
                        <td>
                            <span class="badge badge-{badgeClasses.{season.status}}"><f:translate domain="typo3_chameleon_login.module" key="status.{season.status}" /></span>
                        </td>
                        <td class="col-control">
                            <f:render section="Controls" arguments="{_all}" />
                        </td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>
</f:section>

<f:section name="Controls">
    <f:variable name="editLabel" value="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:edit')}" />
    <div class="btn-group">
        <be:link.editRecord table="{table}" uid="{season.uid}" returnUrl="{returnUrl}" class="btn btn-default" title="{editLabel}" aria-label="{editLabel}">
            <core:icon identifier="actions-open" />
        </be:link.editRecord>
        <f:if condition="{season.hidden}">
            <f:then>
                <f:variable name="unhideLabel" value="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:unHide')}" />
                <a class="btn btn-default" href="{be:moduleLink(route: 'tce_db', query: 'data[{table}][{season.uid}][hidden]=0', arguments: '{redirect: returnUrl}')}" title="{unhideLabel}" aria-label="{unhideLabel}">
                    <core:icon identifier="actions-edit-unhide" />
                </a>
            </f:then>
            <f:else>
                <f:variable name="hideLabel" value="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:hide')}" />
                <a class="btn btn-default" href="{be:moduleLink(route: 'tce_db', query: 'data[{table}][{season.uid}][hidden]=1', arguments: '{redirect: returnUrl}')}" title="{hideLabel}" aria-label="{hideLabel}">
                    <core:icon identifier="actions-edit-hide" />
                </a>
            </f:else>
        </f:if>
    </div>
</f:section>
